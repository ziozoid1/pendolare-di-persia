<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Il Pendolare di Persia</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%;
    background: #0a0a0f; color: #8a8a96;
    font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 16px;
  }
  #game { border: 2px solid #555; box-shadow: 0 0 0 6px #111118; line-height: 0; }
  #game canvas { display: block; image-rendering: pixelated; }
  #legend { font-size: 12px; max-width: 620px; line-height: 1.7;
            display: grid; grid-template-columns: auto 1fr; gap: 0 14px; }
  #legend b { color: #ffff55; font-weight: normal; white-space: nowrap; }
</style>
</head>
<body>
  <div id="game"></div>
  <div id="legend">
    <b>&larr; &rarr;</b><span>camminare &mdash; con <b>Shift</b> correre</span>
    <b>&uarr; / Spazio</b><span>saltare</span>
    <b>&darr;</b><span>stringere la borsa al petto</span>
    <b>N</b><span>&laquo;no grazie&raquo;</span>
    <b>R</b><span>ricominciare lo stage</span>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
